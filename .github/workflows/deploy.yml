name: Deploy to Hostinger

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, gd, pdo_mysql, mbstring, apcu
          coverage: none

      - name: Install Composer dependencies
        # APP_ENV=prod so post-install auto-scripts don't try to boot dev-only
        # bundles (e.g. DebugBundle) that --no-dev has already removed.
        env:
          APP_ENV: prod
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # Writes a real .env.local (git-ignored, generated fresh per deploy) so
      # the app doesn't need server-side env var configuration, which
      # Hostinger shared hosting doesn't expose. Deliberately NOT using
      # `composer dump-env`: it ignores real process env vars by design and
      # only reflects the committed .env files, so it can't be used to inject
      # CI secrets - it would silently ship the dev DATABASE_URL to prod.
      # Written before the build/warmup steps below so they run against the
      # real prod config, not the dummy values in the committed .env.
      - name: Write production environment
        run: |
          cat > .env.local <<'ENVEOF'
          APP_ENV=prod
          APP_SECRET="${{ secrets.PROD_APP_SECRET }}"
          DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}"
          MAILER_DSN="${{ secrets.PROD_MAILER_DSN }}"
          ENVEOF

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        # Outputs directly to public/build/ (Vite manifest + versioned files),
        # no separate frontend/ directory or asset-mapper compile step needed.
        run: npm run build

      # With APP_DEBUG off, Symfony trusts an existing compiled container
      # cache forever and never re-checks it against source - see
      # ResourceCheckerConfigCache::isFresh(), which short-circuits to `true`
      # when there are no resource checkers (only registered in debug mode).
      # Since var/cache/prod travels with the deploy (see the FTP step
      # below), it must be rebuilt here on every run so it matches this
      # commit's code, or prod would keep serving a stale/incompatible
      # container after any change to services, routes, or entities.
      - name: Warm up production cache
        env:
          APP_ENV: prod
        run: php bin/console cache:clear --env=prod --no-interaction

      # This host's primary domain has its document root permanently fixed to
      # public_html (hPanel's domain management shows "No configuration
      # options currently exist" for it - only addon/subdomains support a
      # custom document root), so the whole project can't just be uploaded
      # as-is with the document root pointed at public/ the normal way. This
      # was discovered the hard way: an earlier deploy without this step
      # left public_html serving an Apache directory listing of the entire
      # project - including .env.local, with real DB/mailer credentials.
      #
      # Fix: move public/'s contents up so index.php lands directly at the
      # deploy root (matching public_html), and lock down every other
      # top-level thing PHP still needs on disk (vendor/, src/, config/,
      # templates/, translations/, var/, .env.local, composer.json) with a
      # deny-all .htaccess/<FilesMatch> block. PHP's own require()/include()
      # reads files directly off disk and never goes through Apache, so this
      # doesn't break the app - it only blocks the same files from being
      # served as plain HTTP responses. Only ever touches this CI checkout,
      # never the repo - local dev keeps using the normal public/ layout via
      # nginx, which doesn't consult .htaccess at all.
      #
      # composer.json specifically MUST stay in the deploy despite not being
      # "needed" in an obvious sense: Kernel::getProjectDir() auto-detects
      # the project root by walking up from src/Kernel.php looking for a
      # composer.json file. Without it present anywhere, that walk silently
      # falls back to returning the src/ directory itself as the project
      # root, which breaks every path built from %kernel.project_dir% -
      # templates, var/cache, config, translations all resolve to
      # nonexistent paths under src/. This produced a blank prod 500 on
      # every route and took real debugging (a diagnostic script forcing
      # error display, since APP_DEBUG=0 normally hides it) to track down.
      - name: Restructure for fixed public_html document root
        run: |
          set -e
          sed -i 's#dirname(__DIR__)#__DIR__#' public/index.php
          for dir in vendor src config templates translations var; do
            if [ -d "$dir" ]; then
              cat > "$dir/.htaccess" <<'DENYEOF'
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          DENYEOF
            fi
          done
          cat >> public/.htaccess <<'ENVDENYEOF'

          # Added at deploy time: never serve these over HTTP even though
          # they must stay on disk (.env.local has real secrets; .env has
          # committed non-secret defaults - see the DEFAULT_URI note below -
          # but no reason to expose it either; composer.json is required by
          # Kernel::getProjectDir()'s auto-detection, see the step comment
          # above).
          <FilesMatch "^(\.env|\.env\.local|composer\.json)$">
              <IfModule mod_authz_core.c>
                  Require all denied
              </IfModule>
              <IfModule !mod_authz_core.c>
                  Order allow,deny
                  Deny from all
              </IfModule>
          </FilesMatch>
          ENVDENYEOF
          shopt -s dotglob
          mv public/* .
          shopt -u dotglob
          rmdir public

      # Every GitHub-hosted run starts from a clean checkout with no memory of
      # what's already on the server, so without this, FTP-Deploy-Action
      # treats every file (including all of vendor/, thousands of files) as
      # new on every single deploy - a full resync over shared-hosting FTP,
      # which is slow (~20+ min) and was seen dropping mid-transfer with
      # "Server sent FIN packet unexpectedly". Caching the action's own state
      # file between runs makes it re-diff against what it last uploaded, so
      # normal deploys only transfer what actually changed. Keyed by run id
      # (always a fresh cache miss) with a prefix restore-key so it still
      # picks up the most recent previous state - the standard "growing
      # cache" pattern, since actions/cache doesn't support mutating one key.
      # The "-v2-" prefix bump below deliberately orphans every state file
      # cached under the old "ftp-deploy-sync-state-" prefix. Two deploys in
      # a row failed mid-upload (see git log around this line) - the "Deploy
      # over FTP" step failing means its "Post Restore FTP sync state" save
      # never runs, so the cached state stopped reflecting reality on the
      # server after the first failure. The next run then diffed against
      # that stale state, decided a directory FTP-Deploy-Action itself had
      # never finished creating was now safe to remove, and 550'd trying to
      # CWD into the folder it had just deleted to confirm the removal.
      # Bumping the prefix makes this run start from no cached state at all,
      # so FTP-Deploy-Action falls back to a full comparison-free upload
      # (slower, ~20+ min per the note below, but can't misfire on a bad
      # diff) and - assuming it succeeds - saves a fresh, accurate state
      # that later incremental deploys can trust again.
      - name: Restore FTP sync state
        uses: actions/cache@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-deploy-sync-state-v2-${{ github.run_id }}
          restore-keys: |
            ftp-deploy-sync-state-v2-

      # var/cache/prod is deliberately handled by lftp below, not
      # FTP-Deploy-Action, and excluded from its own upload set (see the
      # exclude list on "Deploy over FTP"). Three deploys in a row 550'd
      # with "Can't change directory ... No such file or directory" whenever
      # FTP-Deploy-Action needed to replace a container-hash directory under
      # var/cache/prod (its compiled contents differ slightly build-to-build
      # even with identical config) - it removes the old folder but doesn't
      # re-create it before immediately trying to CWD into it for the new
      # upload, and that reproduced identically whether the folder was being
      # freshly deleted by us first or left for FTP-Deploy-Action's own
      # diffing to discover, and whether its cache-state file was fresh or
      # stale. That's a real bug in FTP-Deploy-Action@v4.3.5's
      # remove-then-recreate ordering for this exact pattern, not something
      # tunable from this side of it. `lftp mirror --reverse --delete` does
      # the same "make remote match local exactly" job as a mature,
      # dedicated sync tool (proven reliable against this server by the
      # src/var cleanup below across all of those attempts) and doesn't
      # share that bug.
      #
      # src/var is a separate, one-off relic: an earlier deploy (before
      # composer.json was included - see the "Restructure" step comment
      # above) left Kernel::getProjectDir() falling back to src/ as the
      # project root, so Symfony wrote a compiled container to
      # src/var/cache/prod instead of the real var/cache/prod. Nothing in
      # the local build tree lives at src/var, so FTP-Deploy-Action has no
      # way to know that stray copy exists and never removes it - hence
      # deleting it out-of-band here too.
      #
      # .ftp-deploy-sync-state.json was also found to have been uploaded to
      # the live server on past deploys (it was never in the exclude list
      # below), leaking CI bookkeeping onto the public filesystem. Deleting
      # the current leaked copy here; the exclude list now stops it
      # recurring.
      #
      # cmd:fail-exit off so a first-ever deploy (nothing to delete/mirror
      # yet on a brand new server) doesn't fail the job. ssl:priority below
      # forces TLS 1.2: dropping parallel transfers didn't stop
      # "gnutls_handshake: An unexpected TLS packet was received" - it
      # recurred on a single sequential transfer too. Ubuntu's lftp is
      # linked against GnuTLS, and this exact error against FTPS servers is
      # a well-documented GnuTLS/TLS-1.3 session-resumption incompatibility
      # on the data channel (separate handshake per file, reusing the
      # control channel's session) - not something specific to this server,
      # since FTP-Deploy-Action's Node/OpenSSL-based TLS stack doesn't share
      # the bug. Forcing the data channel down to TLS 1.2 sidesteps the
      # incompatibility while keeping it fully encrypted, unlike disabling
      # ftp:ssl-protect-data outright.
      - name: Sync var/cache/prod and remove stale remote cache
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -e "
            set ssl:verify-certificate no;
            set ssl:priority NORMAL:-VERS-TLS1.3;
            set ftp:ssl-force true;
            set cmd:fail-exit no;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftps://${{ secrets.FTP_SERVER }}:21;
            rm -rf src/var;
            rm -f .ftp-deploy-sync-state.json;
            mirror --reverse --delete --verbose var/cache/prod var/cache/prod;
            exit;
          "

      # .env (committed, non-secret defaults only - real secrets live in
      # .env.local, written above) is deliberately NOT excluded below,
      # despite an earlier version of this workflow excluding it "to be
      # safe": Symfony's compiled prod container needs DEFAULT_URI (defined
      # only in .env, used to build the router's RequestContext service)
      # even for normal HTTP requests, not just the CLI context its comment
      # suggests. Excluding .env caused a blank prod 500 on every route
      # (EnvNotFoundException, only visible via a diagnostic script since
      # APP_DEBUG=0 hides it). .env.local is loaded after .env and correctly
      # overrides APP_ENV/APP_SECRET/DATABASE_URL/MAILER_DSN as intended;
      # it's still denied over HTTP below alongside .env.local, same as any
      # other file PHP needs on disk but nobody should fetch directly.
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          timeout: 120000
          log-level: verbose
          state-name: .ftp-deploy-sync-state.json
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/var/log/**
            **/var/share/**
            **/var/cache/**
            .ftp-deploy-sync-state.json
            **/.github/**
            **/compose*.yaml
            **/nginx.conf
            **/.env.dev
            **/.env.test
            **/AGENTS.md
            **/CLAUDE.md
            **/docs/**
            **/content/**
            assets/**
            **/bin/**
            **/migrations/**
            **/composer.lock
            **/symfony.lock
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/phpunit.dist.xml
            **/README*
