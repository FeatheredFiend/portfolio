name: Test and deploy

# The same pipeline as the games: every push to main that passes the tests is
# published to the `deploy` branch, and the host's Git clone of that branch
# (public_html) pulls it on a cron job. Pull requests run the tests only.
# One-off host setup and how it all fits together: docs/DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # For the tests. Doctrine adds the _test suffix to the database name itself.
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, gd, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci
      # The templates read Vite's manifest, so the tests need the build too.
      - run: npm run build

      - name: Test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/portfolio?serverVersion=10.11.18-MariaDB&charset=utf8mb4
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/phpunit

      # The site to publish: production packages only, and .env compiled for
      # prod. No secrets: on the host those live in ~/portfolio.env, outside
      # the web root, loaded by config/runtime.php. BUILD names this deploy so
      # Symfony starts a fresh cache (see Kernel::getCacheDir()), because the
      # host pulls without running any commands.
      - name: Assemble the site
        env:
          APP_ENV: prod
        run: |
          set -e
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          composer dump-env prod
          echo "${GITHUB_SHA::12}" > BUILD
          # Fails the job here, rather than as a blank 500 on the live site,
          # if the production container doesn't compile.
          php bin/console cache:warmup --env=prod --no-interaction
          mkdir site
          rsync -a \
            --exclude /site/ --exclude /.git/ --exclude /.github/ --exclude /.claude/ \
            --exclude /node_modules/ --exclude /assets/ --exclude /tests/ --exclude /var/ \
            --exclude /docs/ --exclude /content/ --exclude /.phpunit.cache/ \
            --exclude /bin/phpunit --exclude /phpunit.dist.xml \
            --exclude '/compose*.yaml' --exclude /nginx.conf \
            --exclude /.env.dev --exclude /.env.test --exclude /.env.local \
            --exclude /package.json --exclude /package-lock.json --exclude /vite.config.js \
            --exclude /composer.lock --exclude /symfony.lock \
            --exclude /AGENTS.md --exclude /CLAUDE.md --exclude /.editorconfig \
            --exclude /.gitignore --exclude /.gitattributes \
            ./ site/

      # The primary domain's document root is fixed to public_html: the host
      # offers no way to point it at public/. So public/'s contents become the
      # site's root, with the rest of the app beside them, refused over HTTP.
      # PHP's require() reads those files straight off disk, so the app still
      # works; only fetching them as URLs is blocked. This is the same layout
      # the FTP deploy used (see the git history of this file for the long
      # story); only the delivery changed. Local Docker keeps the normal
      # public/ layout. config/packages/pentatrion_vite.yaml points Vite at
      # this layout in prod.
      #
      # composer.json must stay: Kernel::getProjectDir() finds the project
      # root by looking for it, and without it every path resolves under src/.
      # .env must stay too: the compiled .env.local.php is built from it, and
      # the container needs DEFAULT_URI from it.
      - name: Restructure for the fixed public_html document root
        working-directory: site
        run: |
          set -e
          sed -i 's#dirname(__DIR__)#__DIR__#' public/index.php
          mkdir -p var
          for dir in bin config migrations src templates translations var vendor; do
            cat > "$dir/.htaccess" <<'DENYEOF'
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          DENYEOF
          done
          cat >> public/.htaccess <<'ROOTEOF'

          # Added by the deploy workflow. The site folder is a Git clone of the
          # deploy branch, so never serve .git; and never serve the settings,
          # build name or Composer files that sit beside the public files.
          RedirectMatch 404 /\.git
          <FilesMatch "^(\.env|\.env\.local|\.env\.local\.php|composer\.json|BUILD)$">
              <IfModule mod_authz_core.c>
                  Require all denied
              </IfModule>
              <IfModule !mod_authz_core.c>
                  Order allow,deny
                  Deny from all
              </IfModule>
          </FilesMatch>
          ROOTEOF
          shopt -s dotglob
          mv public/* .
          shopt -u dotglob
          rmdir public

      - name: Publish build to the deploy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./site
          commit_message: Deploy
