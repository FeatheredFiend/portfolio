services:
  web:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: thecodingmachine/php:8.4-v4-fpm
    volumes:
      - .:/var/www/html
    environment:
      PHP_EXTENSION_INTL: 1
      PHP_EXTENSION_PDO_MYSQL: 1
      PHP_EXTENSION_GD: 1
      PHP_EXTENSION_APCU: 1
      APP_SECRET: d44e991e5c913d59adeb65fc81da813c
      DATABASE_URL: "mysql://symfony:symfony@database:3306/portfolio?serverVersion=10.11.18-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
      PHP_INI_UPLOAD_MAX_FILESIZE: 10M
      PHP_INI_POST_MAX_SIZE: 12M
    depends_on:
      - database
      - mailer

  database:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: symfony
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3309:3306"

  mailer:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
